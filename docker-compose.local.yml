services:
  3d-print-analyzer:
    build:
      context: .
    image: 3d-print-cost-analyzer:local
    ports:
      - "8080:80"
    volumes:
      # Mount data directory for persistent storage across devices
      - ./data:/app/data
    environment:
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin
      - ALLOW_DEFAULT_CREDENTIALS=true
